version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      next-stack:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
      prisma:
        patterns:
          - prisma
          - "@prisma/*"
      test-tooling:
        patterns:
          - vitest
          - "@vitest/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
