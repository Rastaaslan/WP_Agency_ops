name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  app:
    name: Next.js app
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      ALLOW_PRIVATE_NETWORK_TARGETS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  wordpress-plugin:
    name: WordPress companion plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: PHP syntax check
        run: npm run plugin:lint

      - name: Package plugin
        run: npm run plugin:zip

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: wp-agency-ops-companion
          path: dist/wp-agency-ops-companion.zip
